name: Build

# neoOMSI's release CI packs the launcher from main into every release: a launcher that no
# longer packages breaks those builds, so every platform is packaged here first.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect packaging-relevant changes
    runs-on: ubuntu-slim

    outputs:
      run-build: ${{ steps.changes.outputs.run-tests }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: bash scripts/ci/detect-test-changes.sh

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.run-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, flag: --win, arch: x64, runner: windows-latest }
          - { platform: windows, flag: --win, arch: arm64, runner: windows-latest }
          - { platform: macos, flag: --mac, arch: arm64, runner: macos-latest }
          - { platform: macos, flag: --mac, arch: x64, runner: macos-latest }
          - { platform: linux, flag: --linux, arch: x64, runner: ubuntu-22.04 }
          - { platform: linux, flag: --linux, arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Package
        shell: bash
        run: >
          pnpm exec electron-builder --dir ${{ matrix.flag }} --${{ matrix.arch }}
          -c.directories.output=release/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Archive
        shell: bash
        run: |
          out="release/${{ matrix.platform }}-${{ matrix.arch }}"
          shopt -s nullglob
          dirs=("$out"/*-unpacked "$out"/mac*)
          [ "${#dirs[@]}" -eq 1 ] || { echo "::error::expected one packaged app in $out: ${dirs[*]}"; exit 1; }
          tar -czf "neoOMSI-Launcher-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C "$out" "$(basename "${dirs[0]}")"

      - uses: actions/upload-artifact@v7
        with:
          name: neoOMSI-Launcher-${{ matrix.platform }}-${{ matrix.arch }}
          path: neoOMSI-Launcher-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          archive: false
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 3 }}

  required:
    name: Packaging
    needs: [changes, package]
    if: always()
    runs-on: ubuntu-slim

    steps:
      - name: Verify packaging result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          RUN_BUILD: ${{ needs.changes.outputs.run-build }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection failed."
            exit 1
          fi

          if [ "$RUN_BUILD" = "true" ]; then
            if [ "$PACKAGE_RESULT" != "success" ]; then
              echo "::error::Packaging was required but did not succeed on every platform."
              exit 1
            fi

            echo "Every platform packaged."
          else
            echo "No code changes. Packaging was safely skipped."
          fi
